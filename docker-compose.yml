version: '3.9'

services:
  python-engine:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./python-engine:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - ./python-engine/.env

  backend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    environment:
      - PYTHON_ENGINE_URL=http://python-engine:8000
    depends_on:
      - python-engine

  frontend:
    image: node:20-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
